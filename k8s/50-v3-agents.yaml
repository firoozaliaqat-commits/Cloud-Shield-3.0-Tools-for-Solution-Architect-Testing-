apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudshield
  name: load-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-1
  template:
    metadata:
      labels:
        app: load-1
    spec:
      containers:
      - name: load-1
        image: cloudshield-k6-agent:3.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8097
        env:
        - name: AGENT_NAME
          value: load-1
        - name: TOOLBOX_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudshield-key
              key: toolboxToken
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 400m
            memory: 280Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  namespace: cloudshield
  name: load-1
spec:
  selector:
    app: load-1
  ports:
  - port: 8097
    targetPort: 8097
---
