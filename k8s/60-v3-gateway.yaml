apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudshield-gateway
  namespace: cloudshield
data:
  Caddyfile: "# Admin UI and /api management BYPASS Coraza to avoid classroom lockout.\n\
    # Protected Demo Store traffic only enters through Coraza.\n:8080 {\n  @protected\
    \ path /target/*\n  handle @protected {\n    reverse_proxy waf:8080\n  }\n  handle\
    \ {\n    reverse_proxy labapp:8000\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudshield
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: caddy:2.10-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        resources:
          requests:
            cpu: 20m
            memory: 30Mi
          limits:
            cpu: 300m
            memory: 140Mi
      volumes:
      - name: config
        configMap:
          name: cloudshield-gateway
---
apiVersion: v1
kind: Service
metadata:
  namespace: cloudshield
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
