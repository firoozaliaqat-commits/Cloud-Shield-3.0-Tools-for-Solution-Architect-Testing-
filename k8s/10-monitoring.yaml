apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudshield
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\nscrape_configs:\n\
    \  - job_name: cloudshield\n    metrics_path: /metrics\n    static_configs:\n\
    \      - targets: ['labapp:8000']\n  - job_name: ecs-node\n    static_configs:\n\
    \      - targets: ['node-exporter:9100']\n  - job_name: prometheus\n    static_configs:\n\
    \      - targets: ['prometheus:9090']\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.4.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 550Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudshield
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.6.2
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'true'
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: Viewer
        - name: GF_AUTH_DISABLE_LOGIN_FORM
          value: 'true'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /var/lib/grafana/dashboards/01-overview.json
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 600Mi
        volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
          subPath: prometheus.yaml
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/dashboards/provider.yml
          subPath: provider.yaml
        - name: dashboard
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-provisioning
      - name: dashboard
        configMap:
          name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudshield
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: cloudshield
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.9.1
        args:
        - --path.rootfs=/host
        ports:
        - containerPort: 9100
        volumeMounts:
        - name: host
          mountPath: /host
          readOnly: true
        resources:
          requests:
            cpu: 20m
            memory: 24Mi
          limits:
            cpu: 300m
            memory: 170Mi
      volumes:
      - name: host
        hostPath:
          path: /
          type: Directory
      hostPID: true
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: cloudshield
spec:
  selector:
    app: node-exporter
  ports:
  - port: 9100
    targetPort: 9100
